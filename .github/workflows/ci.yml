name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - uses: actions/cache@v6
        with:
          path: .native-cache/sources
          key: libjxl-${{ hashFiles('native/versions.json') }}
      # Tests the library built from source on this commit, not the released one.
      - run: tool/native/build_unix.sh linux-x64
      - run: tool/use_local_build.py linux-x64
      - run: dart pub get
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart test
